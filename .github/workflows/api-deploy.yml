name: Deploy Churn Predictor
run-name: Deploy by @${{ github.actor }}

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Dockerfile*"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          port: 22
          timeout: 30m 
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/home/${{ secrets.AZURE_USER }}/churn-predictor"
            # Check if repository exists
            if [ ! -d "$APP_DIR" ]; then
                echo "Repository doesn't exist. Cloning..."
                git clone https://github.com/Jordan-buwa/churn-predictor.git "$APP_DIR"
                cd "$APP_DIR"
            else
                echo "Repository exists, attempting to pull changes..."
                cd "$APP_DIR"
                
                # Try to pull changes
                if git pull origin main; then
                    echo "✅ Successfully pulled latest changes from main"
                else
                    echo "❌ Git pull failed. This could be due to:"
                    echo "   - Local changes conflicting"
                    echo "   - Force push to remote"
                    echo "   - Repository corruption"
                    
                    echo "Deleting local repository and cloning fresh..."
                    
                    # Go to parent directory
                    cd ..
                    
                    # Remove the entire directory
                    rm -rf "$APP_DIR"
                    
                    # Clone fresh
                    git clone https://github.com/Jordan-buwa/churn-predictor.git "$APP_DIR"
                    
                    echo "✅ Fresh clone completed"
                fi
            fi

            cd "$APP_DIR"
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Ensure on main branch
            git checkout main
            git fetch --all && git reset --hard origin/main
            # Create .env file from secrets
            cat > .env << 'EOF'
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_DB_NAME=${{ secrets.POSTGRES_DB_NAME }}
            POSTGRES_DB_USER=${{ secrets.POSTGRES_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_DB_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB_NAME }}?sslmode=require
            MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
            API_KEY_SECRET=${{ secrets.API_KEY_SECRET }}
            EOF
            echo ".env created."
            # Restart services
            docker compose down --remove-orphans --volumes || true
            # Build and start new services
            echo "Building and starting services..."
            docker compose build --no-cache 
            docker compose up -d
            docker system prune -af --volumes || true