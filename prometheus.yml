# prometheus.yml - 
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'churn_predictor_api'
    static_configs:
      - targets: ['api:8000']  
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'mlflow_exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['mlflow_exporter:9100']  
