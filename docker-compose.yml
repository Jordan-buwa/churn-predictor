  #     - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
  #   depends_on:
  #     - mlflow
  #   deploy:
  #     replicas: 1   
  #   networks:
  #     - monitor-net

# PROMETHEUS SERVER
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      # Map the configuration file (prometheus.yml)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Prometheus UI runs on http://localhost:9090
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    # DEPENDS ON 'api' to ensure target is up
    depends_on:
      - api 
      - mlflow
    networks:
      - monitor-net

  # GRAFANA VISUALIZATION 
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      # Grafana UI runs on http://localhost:3000
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitor-net
      
# Define the internal network for the services to talk to each other
networks:
  monitor-net:
    driver: bridge